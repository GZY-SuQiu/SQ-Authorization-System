# SQ 授权系统 · 公网部署编排（VPS）
# 用法：
#   cp -r deploy/ vps/ 到服务器 → 修改 Caddyfile 域名 →
#   docker compose up -d --build
#
# 架构：Caddy 自动 HTTPS 反代 → sq-server（仅内网监听 8765）
services:
  sq-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # 不直接暴露端口：只允许同网络的 Caddy 访问
    expose:
      - "8765"
    volumes:
      - sq-data:/data
    environment:
      SQ_PERSIST_DIR: /data/persist

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sq-data:
  caddy-data:
  caddy-config:
