name: tests

# 测试套件 + 分发卫生检查。
# 交叉说明：python-package-conda.yml 是历史模板，保留不动；本 workflow 是实际门禁。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: 测试套件
    runs-on: ubuntu-latest
    env:
      # PySide6 在无显示环境以 offscreen 平台运行（GUI 测试可收集执行）。
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试
        run: python -m pytest tests/ -q

  shareable-hygiene:
    name: 分发卫生检查
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 扫描仓库中的敏感文件（密钥/配置/数据库/日志）
        run: python tools/check_shareable.py . --fail-on high
